);
let i=0,correct=0,answered=false;const $=id=>document.getElementById(id);
function render(){answered=false;let q=qs[i];$('counter').textContent=`Pregunta ${i+1} de ${qs.length}`;$('scoreMini').textContent=`${correct} aciertos`;$('progress').style.width=`${i/qs.length*100}%`;$('topic').textContent=q[0];$('question').textContent=q[1];$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;$('next').textContent=i===qs.length-1?'Ver resultado':'Siguiente';$('options').innerHTML='';q[2].map((x,n)=>({x,n})).sort(()=>Math.random()-.5).forEach((o,n)=>{let b=document.createElement('button');b.className='option';b.dataset.answer=o.n;b.textContent=String.fromCharCode(65+n)+'. '+o.x;b.onclick=()=>answer(o.n,b);$('options').appendChild(b)})}
function answer(n,btn){if(answered)return;answered=true;let q=qs[i];document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q[3])b.classList.add('correct')});if(n===q[3]){correct++;$('feedback').textContent='✓ Correcto. '+q[4];$('feedback').className='feedback ok'}else{$('feedback').textContent='✗ No era esa. '+q[4];$('feedback').className='feedback bad';btn.classList.add('wrong')}$('scoreMini').textContent=`${correct} aciertos`;$('next').disabled=false}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let pct=Math.round(correct/qs.length*100);$('finalScore').textContent=`${correct}/${qs.length} (${pct}%)`;$('finalText').textContent=pct>=80?'Muy buen nivel. Estás llegando bien preparado/a.':pct>=60?'Buen comienzo: repasá las explicaciones de las que fallaste.':'Conviene repasar los conceptos y volver a intentarlo.'}
$('next').onclick=()=>{if(i===qs.length-1)finish();else{i++;render()}};$('restart').onclick=()=>{i=0;correct=0;render()};$('again').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.remove('hidden');i=0;correct=0;render()};render();
</script></body></html>
